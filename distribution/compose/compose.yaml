services:
  postgres:
    # Pinned by tag and multi-arch index digest (verified against Docker Hub registry 2026-10-15)
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ragpipeline
      POSTGRES_DB: ragpipeline
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - source: db_connection_string
        target: ConnectionStrings__Database
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    privileged: false
    volumes:
      - app-keys:/var/lib/ragpipeline/keys
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/system/health/live HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | head -n 1 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_connection_string:
    file: ./secrets/ConnectionStrings__Database.txt

volumes:
  pgdata:
  app-keys:
